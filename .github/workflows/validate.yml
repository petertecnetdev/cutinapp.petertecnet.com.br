name: Validate Cutinapp

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

concurrency:
  group: cutinapp-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reject legacy product API paths in runtime services
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn '/cutinapp/' src/services; then
            echo 'Runtime services must consume /api/v1/apps/{application} through AppApiClient.' >&2
            exit 1
          fi
      - run: npm run lint:overlays
      - run: npm run lint:dialogs
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build
      - run: npm run perf:budget
