name: Materialize revenue add-on net preview

on:
  push:
    branches:
      - automation/revenue-addon-net-preview-run5-gh

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/revenue-addon-net-preview-run5-gh
          fetch-depth: 0
      - name: Apply focused monetization change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sales = Path('src/pages/commerce/ProducerSalesPage.js')
          text = sales.read_text()
          old = '&addonSource=${event.suggestedAddOnSource}` : ""}`}'
          new = '&addonSource=${event.suggestedAddOnSource}&addonNetMargin=${encodeURIComponent(event.incrementalNetMargin.toFixed(4))}` : ""}`}'
          if old not in text:
              raise SystemExit('sales CTA anchor not found')
          sales.write_text(text.replace(old, new, 1))

          event = Path('src/pages/event/EventUpdatePage.js')
          text = event.read_text()
          old = '''  const suggestedAddOnStock = Number(queryParams.get("addonStock") || 0);\n  const requestedAddOnSource = queryParams.get("addonSource");\n  const suggestedAddOnSource = ["event", "production"].includes(requestedAddOnSource) ? requestedAddOnSource : "";\n  const hasSuggestedAddOnPrice = Number.isFinite(suggestedAddOnPrice) && suggestedAddOnPrice > 0 && Boolean(suggestedAddOnSource);\n  const hasSuggestedAddOnStock = Number.isInteger(suggestedAddOnStock) && suggestedAddOnStock > 0 && suggestedAddOnStock <= 100;'''
          new = '''  const suggestedAddOnStock = Number(queryParams.get("addonStock") || 0);\n  const requestedAddOnSource = queryParams.get("addonSource");\n  const suggestedAddOnNetMargin = Number(queryParams.get("addonNetMargin") || 0);\n  const suggestedAddOnSource = ["event", "production"].includes(requestedAddOnSource) ? requestedAddOnSource : "";\n  const hasSuggestedAddOnPrice = Number.isFinite(suggestedAddOnPrice) && suggestedAddOnPrice > 0 && Boolean(suggestedAddOnSource);\n  const hasSuggestedAddOnStock = Number.isInteger(suggestedAddOnStock) && suggestedAddOnStock > 0 && suggestedAddOnStock <= 100;\n  const boundedSuggestedAddOnNetMargin = Number.isFinite(suggestedAddOnNetMargin) ? Math.max(0, Math.min(100, suggestedAddOnNetMargin)) : 0;'''
          if old not in text:
              raise SystemExit('event query anchor not found')
          text = text.replace(old, new, 1)

          old = '''            gross_potential: Number((price * quantity).toFixed(2)),\n            suggested_price: hasSuggestedAddOnPrice ? suggestedAddOnPrice : null,'''
          new = '''            gross_potential: Number((price * quantity).toFixed(2)),\n            estimated_net_platform_revenue: boundedSuggestedAddOnNetMargin > 0 ? Number((price * quantity * (boundedSuggestedAddOnNetMargin / 100)).toFixed(2)) : null,\n            estimated_net_margin_percentage: boundedSuggestedAddOnNetMargin > 0 ? boundedSuggestedAddOnNetMargin : null,\n            suggested_price: hasSuggestedAddOnPrice ? suggestedAddOnPrice : null,'''
          if old not in text:
              raise SystemExit('telemetry anchor not found')
          text = text.replace(old, new, 1)

          old = '''            {Number(itemForm.price) > 0 && Number(itemForm.quantity) >= 0 && <div className="cut-info-box mt-3"><strong>Potencial bruto deste estoque: {(Number(itemForm.price) * Number(itemForm.quantity || 0)).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</strong><span>É apenas uma referência de GMV se todo o estoque for vendido; não é garantia de receita e não altera o take rate.</span></div>}'''
          new = '''            {Number(itemForm.price) > 0 && Number(itemForm.quantity) >= 0 && <div className="cut-info-box mt-3"><strong>Potencial bruto deste estoque: {(Number(itemForm.price) * Number(itemForm.quantity || 0)).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</strong>{boundedSuggestedAddOnNetMargin > 0 && <span>Receita líquida Peter Tecnet estimada: {(Number(itemForm.price) * Number(itemForm.quantity || 0) * (boundedSuggestedAddOnNetMargin / 100)).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })} · margem líquida observada {boundedSuggestedAddOnNetMargin.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%.</span>}<span>É apenas uma projeção se todo o estoque for vendido, usando a margem líquida observada no painel quando disponível; não é garantia de receita, não cria taxa e não altera o take rate.</span></div>}'''
          if old not in text:
              raise SystemExit('gross potential anchor not found')
          event.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/automation-revenue-addon-net-preview-run5.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/commerce/ProducerSalesPage.js src/pages/event/EventUpdatePage.js .github/workflows/automation-revenue-addon-net-preview-run5.yml
          git commit -m "feat(revenue): projetar receita liquida dos adicionais"
          git push origin HEAD:automation/revenue-addon-net-preview-run5-gh
