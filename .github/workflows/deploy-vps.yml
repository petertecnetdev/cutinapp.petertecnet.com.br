name: Deploy VPS

on:
  workflow_run:
    workflows:
      - Validate Cutinapp
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutinapp-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy validated Cutinapp
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    # The Validate Cutinapp workflow is the release gate. This job builds and deploys
    # exactly the SHA that passed that gate, so newer unvalidated commits cannot slip in.
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/cutinapp.petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      deploy_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      health_url: https://cutinapp.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
