name: Deploy VPS

# CUTINAPP AUTONOMOUS REVENUE SPRINT policy:
# production deployment remains an explicit owner action while agents validate and
# push code through Git. Do not re-enable push/workflow_run deployment without the
# owner's explicit instruction.
on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact validated Cutinapp commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cutinapp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy explicitly selected Cutinapp SHA
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/cutinapp.petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      deploy_sha: ${{ inputs.deploy_sha }}
      health_url: https://cutinapp.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
