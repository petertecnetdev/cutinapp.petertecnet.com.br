name: Refresh SEO Index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - Deploy VPS
    types:
      - completed

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cutinapp-seo-index-refresh
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Check VPS configuration
        id: config
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST}" || -z "${VPS_USER}" || -z "${VPS_SSH_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SEO index refresh skipped because VPS deployment secrets are not configured."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "port=${VPS_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload prerender generator
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -s scripts/generate-seo-snapshots.mjs
          GENERATOR="/tmp/cutinapp-generate-seo-snapshots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.mjs"
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "umask 077; cat > '$GENERATOR'" \
            < scripts/generate-seo-snapshots.mjs

      - name: Publish dynamic sitemap and prerender snapshots
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          GENERATOR="/tmp/cutinapp-generate-seo-snapshots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.mjs"
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=8 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$GENERATOR'" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT="/var/www/cutinapp.petertecnet.com.br"
          LIVE_BUILD="$APP_ROOT/build"
          SEO_ROOT="$APP_ROOT/seo-snapshots"
          GENERATOR="$1"
          SITEMAP_API="https://api.petertecnet.com.br/api/v1/discovery/sitemap.xml?origin=https%3A%2F%2Fcutinapp.petertecnet.com.br&application=cutinapp"

          [[ "$GENERATOR" =~ ^/tmp/cutinapp-generate-seo-snapshots-[0-9]+-[0-9]+\.mjs$ ]] || { echo "Invalid SEO generator path." >&2; exit 1; }
          [[ -d "$LIVE_BUILD" ]] || { echo "Cutinapp live build not found: $LIVE_BUILD" >&2; exit 1; }
          [[ -f "$LIVE_BUILD/index.html" ]] || { echo "Cutinapp live index not found." >&2; exit 1; }
          [[ -f "$GENERATOR" ]] || { echo "SEO prerender generator was not uploaded." >&2; exit 1; }
          command -v node >/dev/null 2>&1 || { echo "Node.js is required for SEO prerender generation." >&2; exit 1; }

          exec 9>/tmp/petertecnet-vps-deploy.lock
          flock -w 180 9 || { echo "Could not acquire deployment lock for SEO refresh." >&2; exit 75; }

          tmp="$(mktemp)"
          next_root="${SEO_ROOT}.next.$$"
          live_event_next="${APP_ROOT}/.cutinapp-event-snapshots.next.$$"
          live_event_previous="${APP_ROOT}/.cutinapp-event-snapshots.previous.$$"
          trap 'rm -f "$tmp" "$GENERATOR"; rm -rf "$next_root" "$live_event_next"' EXIT
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$SITEMAP_API" -o "$tmp"
          grep -q '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' "$tmp" || {
            echo "Dynamic sitemap response is not a valid sitemap." >&2
            exit 2
          }
          grep -q 'https://cutinapp.petertecnet.com.br/event/' "$tmp" || {
            echo "Dynamic sitemap does not contain public event URLs." >&2
            exit 3
          }

          # Fail closed: transactional, account and administrative URLs must never be
          # promoted through the public sitemap, even if the discovery API regresses.
          if grep -Eq 'https://cutinapp\.petertecnet\.com\.br/(checkout|purchases|ticket|passes|checkin|login|register|password|email-verify|logout|dashboard|messages|notifications|admin|agent|moderation)(/|<)' "$tmp"; then
            echo "Dynamic sitemap contains a private or transactional URL; refusing publication." >&2
            grep -E 'https://cutinapp\.petertecnet\.com\.br/(checkout|purchases|ticket|passes|checkin|login|register|password|email-verify|logout|dashboard|messages|notifications|admin|agent|moderation)(/|<)' "$tmp" >&2 || true
            exit 5
          fi

          rm -rf "$next_root" "$live_event_next" "$live_event_previous"
          mkdir -p "$next_root"
          cp "$LIVE_BUILD/index.html" "$next_root/index.html"
          install -m 0644 "$tmp" "$next_root/sitemap.xml"

          # Keep already generated public-event snapshots so ended events remain
          # crawlable after they leave the active discovery feed. The generator
          # fills any sitemap URL that is still missing through the public event API.
          if [[ -d "$SEO_ROOT/event" ]]; then
            mkdir -p "$next_root/event"
            cp -a "$SEO_ROOT/event/." "$next_root/event/"
          elif [[ -d "$LIVE_BUILD/event" ]]; then
            mkdir -p "$next_root/event"
            cp -a "$LIVE_BUILD/event/." "$next_root/event/"
          fi

          CUTINAPP_SEO_PRESERVE_EVENT_SNAPSHOTS=1 CUTINAPP_BUILD_DIR="$next_root" node "$GENERATOR" "$next_root"

          previous="${SEO_ROOT}.previous.$$"
          rm -rf "$previous"
          if [[ -d "$SEO_ROOT" ]]; then mv "$SEO_ROOT" "$previous"; fi
          if ! mv "$next_root" "$SEO_ROOT"; then
            [[ -d "$previous" ]] && mv "$previous" "$SEO_ROOT" || true
            exit 4
          fi
          rm -rf "$previous"

          # Publish every public entity snapshot subtree atomically. This keeps
          # social crawlers on entity-specific metadata instead of the generic SPA shell.
          [[ -d "$SEO_ROOT/event" ]] || { echo "Generated public event snapshots are missing." >&2; exit 6; }
          for subtree in event production blog artist profile; do
            [[ -d "$SEO_ROOT/$subtree" ]] || continue
            live_next="${APP_ROOT}/.cutinapp-${subtree}-snapshots.next.$$"
            live_previous="${APP_ROOT}/.cutinapp-${subtree}-snapshots.previous.$$"
            rm -rf "$live_next" "$live_previous"
            mkdir -p "$live_next"
            cp -a "$SEO_ROOT/$subtree/." "$live_next/"
            if [[ -e "$LIVE_BUILD/$subtree" || -L "$LIVE_BUILD/$subtree" ]]; then
              mv "$LIVE_BUILD/$subtree" "$live_previous"
            fi
            if ! mv "$live_next" "$LIVE_BUILD/$subtree"; then
              [[ -e "$live_previous" || -L "$live_previous" ]] && mv "$live_previous" "$LIVE_BUILD/$subtree" || true
              echo "Unable to activate public $subtree snapshots." >&2
              exit 7
            fi
            rm -rf "$live_previous"
          done

          sample_event="$(grep -m1 -oE '<loc>https://cutinapp\.petertecnet\.com\.br/event/[^<]+' "$SEO_ROOT/sitemap.xml" | sed 's#<loc>##')"
          [[ -n "$sample_event" ]] || { echo "Unable to select an event URL for crawler verification." >&2; exit 8; }
          probe="$(curl --fail --silent --show-error --location --max-time 20 \
            -A 'facebookexternalhit/1.1 (+https://www.facebook.com/externalhit_uatext.php)' \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "${sample_event}?seo_refresh=$(date +%s)")"
          grep -Fq "property=\"og:url\" content=\"$sample_event\"" <<<"$probe" || {
            echo "Crawler verification did not receive event-specific og:url for $sample_event." >&2
            exit 9
          }
          grep -Eq '/static/js/[^\"]+\.js' <<<"$probe" || {
            echo "Crawler snapshot no longer references the SPA JavaScript bundle." >&2
            exit 10
          }

          echo "Dynamic sitemap published: $(grep -c '<url>' "$SEO_ROOT/sitemap.xml") URLs"
          cat "$SEO_ROOT/.cutinapp-seo-snapshots"
          REMOTE