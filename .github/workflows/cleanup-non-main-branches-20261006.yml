name: Cleanup non-main branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > /tmp/branches.txt
          while IFS= read -r branch; do
            if [ "$branch" = "main" ]; then
              continue
            fi
            echo "Deleting: $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          done < /tmp/branches.txt
          echo "Remaining branches:"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name'
