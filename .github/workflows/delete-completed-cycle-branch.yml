name: Delete completed cycle branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/delete-completed-cycle-branch.yml"

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed cycle branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: cycle/pwa-installability-20261006
        run: |
          set -euo pipefail
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$BRANCH"
