name: Branch cleanup once 2026-10-03

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete allowlisted branches with verified no exclusive runtime value
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          branches=(
            "automation/cutinapp-design-system-51-100"
            "automation/ui-101-200-vitals"
            "feat/event-manager-211-final-20260918"
            "fix/artist-profile-events-v2"
            "perf/120-complete-20260918"
            "feat/asaas-payouts-complete"
            "fix/cart-menu-safe-layer-20260917"
            "automation/pix-post-copy-confirm-r12"
            "automation/pix-copy-mobile-fallback-r11"
            "automation/pix-copy-sticky-r11"
            "automation/mobile-pix-direct-attempt-r12"
            "automation/restore-checkout-cta-r11"
            "automation/event-funnel-visibility-r11"
            "automation/precheckout-funnel-r11"
            "automation/fulfillment-recovery-economics-ui-r11"
            "automation/fulfillment-sla-ui-r11"
            "automation/admin-fulfillment-action-r11"
            "automation/guest-pix-frontend-r11"
            "automation/checkout-auth-handoff-r11"
            "automation/cutinapp-r11-pix-economics"
            "automation/cutinapp-r11-cross-session"
            "automation/cutinapp-r11-pix-terminal"
            "automation/cutinapp-r11-pix-resume"
            "automation/cutinapp-revenue-r11"
            "automation/idempotency-processing-r11"
            "automation/idempotency-processing-recovery-r12"
            "automation/payment-retry-after-guard-r11"
            "automation/event-payment-readiness-r11"
            "automation/checkout-retry-after-r11c"
            "automation/payment-sync-retry-after-r11"
            "automation/jitter-rate-limited-payment-sync-r11"
            "automation/clear-fulfilled-checkout-recovery-r11"
            "automation/checkout-payment-method-recovery-r11"
            "automation/checkout-telemetry-priority-r11"
            "automation/cutinapp-production-telemetry-r11"
            "automation/checkout-journey-origin-r13"
            "automation/checkout-price-transparency-r17"
            "automation/payment-health-recovery-attribution-ui-r16"
            "automation/payment-health-diagnosis-ui-r15"
            "automation/payment-health-incidents-ui-r14"
            "automation/payment-health-trend-r12"
            "automation/payment-health-risk-ui-r11"
            "automation/payment-pending-health-r11"
            "automation/treatment-attribution-ui-r11"
            "automation/cutinapp-rollout-readiness-ui"
            "fix/ci-proptypes-eslintrc-r11"
            "fix/ci-proptypes-r11"
            "automation/recovery-rollout-readiness-r11-latest"
            "automation/recovery-projection-ui-r11-remote"
            "feat/event-command-center-195"
          )

          failures=0
          for branch in "${branches[@]}"; do
            echo "Checking $branch"
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
                echo "Deleted $branch"
              else
                echo "FAILED to delete $branch"
                failures=$((failures + 1))
              fi
            else
              echo "Already absent: $branch"
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "$failures branch deletions failed"
            exit 1
          fi

          echo "Verified allowlist deletion pass completed."
