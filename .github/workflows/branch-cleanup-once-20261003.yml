name: Branch cleanup once 2026-10-03

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete allowlisted branches with verified no exclusive runtime value
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          branches=(
            "hotfix/official-brand-logos-20261006"
            "hotfix/20261005-cutinapp-production-create-lint"
            "hotfix/20261005-cutinapp-navbar-recovery-test"
            "hotfix/20261005-cutinapp-react-stability-baseline"
            "hotfix/20261005-cutinapp-ci-source-map-loader"
            "hotfix/20261005-cutinapp-navbar-logo"
            "w08/artist-claim-relations"
            "w08/onboarding-relational-navigation"
            "w08/search-analytics-live-query"
            "w08/admin-access-user-deeplink"
            "w08/finance-order-deeplink"
            "w08/admin-checkin-relations"
            "w08/admin-order-relations"
            "w08/admin-ticket-event-route"
            "w08/admin-production-public-route"
            "w10/mobile-navbar-recovery-tests"
            "fix/alert-copy-boundary"
            "w08/admin-event-canonical-route"
            "w08/notification-entity-fallbacks"
            "w08/feed-canonical-entity-routes"
            "fix/event-view-v3-visual-20260927"
            "w09/production-public-seo"
            "w08/home-entity-canonical-routes"
            "w08/global-search-safe-route"
            "w08/home-production-route"
            "w08/entity-item-direct-route"
            "fix/mobile-hamburger-direct-control-20260927"
            "growth/production-public-polish-20260927"
            "growth/compact-home-hero-events-first"
            "feat/event-view-evolution-20260927"
            "feat/profile-event-discovery-rail"
            "fix/release-diagnostic-ssh-unavailable"
            "fix/release-diagnostic-heredoc"
            "feat/flyer-date-consistency"
            "fix/optional-seo-snapshots-deploy"
            "fix/production-cover-live-preview-20260919"
            "feat/production-inline-editor-20260919"
            "perf/point-195-frontend-error-monitoring"
            "fix/landing-navbar-top-gap-20260919"
            "fix/cart-selection-payment-sync-20260919"
            "ci/cutinapp-198-200-main-reconciled"
            "perf/cutinapp-57-moderation-stable-keys"
            "perf/cutinapp-1-50-swr-main"
            "ci/cutinapp-lighthouse-199"
            "perf/react-stability-57-notifications"
            "perf/react-stability-57-v3"
            "perf/pontos-1-50-request-dedupe"
            "automation/cutinapp-101-200-error-boundary"
            "feat/event-ai-image-fallback-20260919"
            "perf/optimized-image-foundation"
          )

          failures=0
          for branch in "${branches[@]}"; do
            echo "Checking $branch"
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
                echo "Deleted $branch"
              else
                echo "FAILED to delete $branch"
                failures=$((failures + 1))
              fi
            else
              echo "Already absent: $branch"
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "$failures branch deletions failed"
            exit 1
          fi

          echo "Verified allowlist deletion pass completed."
