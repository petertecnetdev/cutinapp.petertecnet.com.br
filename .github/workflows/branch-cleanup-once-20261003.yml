name: Branch cleanup once 2026-10-03

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete allowlisted branches with verified no exclusive runtime value
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          branches=(
            "fix/production-public-cover-20260919"
            "perf/gallery-manager-and-app-speed-20260919"
            "feat/view-mode-create-edit-unification-20260919"
            "fix/event-artwork-natural-light-20260919"
            "feat/event-view-parity-editor-20260919"
            "perf/scroll-main-thread-v2-20260919"
            "perf/css-single-entry-20260919"
            "feat/feed-post-management-20260919"
            "feat/feed-admin-moderation-20260919"
            "perf/abort-obsolete-requests-20260919-2100"
            "perf/mobile-scroll-visual-cost-20260919-2112"
            "perf/mobile-scroll-handler-20260919"
            "perf/defer-noncritical-runtime-603"
            "fix/production-hero-bottom-dock-20260919-v2"
            "agent/np02/production-follow-state"
            "agent/np02/event-editor-view-parity"
            "agent/np02/redeploy-after-marker-fallback"
            "automation/p1-commerce-logout-isolation-1801"
            "automation/cart-empty-selection-20260922-1902"
            "automation/home-image-priority-20260922"
            "automation/discovery-local-calendar-20260922"
            "fix/discovery-sql-datetime-mobile"
            "fix/home-portable-date-labels-20260923"
            "feat/weekly-agenda-event-picker"
            "automation/home-card-media-priority-20260923"
            "automation/home-card-density-20260923-0200"
            "fix/home-discovery-duplicate-keys"
            "automation/discovery-card-categories-20260923"
            "automation/discovery-price-metadata-11"
            "automation/discovery-rail-keyboard-11"
            "automation/discovery-reduced-motion-20260923"
            "automation/discovery-rail-keyboard-20260923-0801"
            "automation/discovery-location-context-11"
            "automation/discovery-rail-image-priority-11"
            "automation/discovery-contextual-date-20260923-1101"
            "agent/np02/event-public-network-recovery"
            "agent/np02/fastix-competitive-100"
            "feat/event-purchase-fastix-terms"
            "fix/readable-typography-cutinapp"
            "fix/admin-impersonation-onboarding-bypass-v2"
            "growth/producer-saas-trial-landing"
            "agent/cutinapp-growth-conversion-global-location"
            "fix/production-feedback-activation-20260925"
            "growth/producer-acquisition-attribution-20260925"
            "fix/production-public-international-contact-20260926"
            "feat/desktop-navbar-three-regions"
            "feat/issue-645-flyer-rich-description"
            "fix/build-script-template-literals"
            "feat/item-discovery-view"
            "feat/event-image-editor-2x3"
          )

          failures=0
          for branch in "${branches[@]}"; do
            echo "Checking $branch"
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
                echo "Deleted $branch"
              else
                echo "FAILED to delete $branch"
                failures=$((failures + 1))
              fi
            else
              echo "Already absent: $branch"
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "$failures branch deletions failed"
            exit 1
          fi

          echo "Verified allowlist deletion pass completed."
