name: Branch cleanup audited 2026-10-12

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-safe-legacy-branches:
    if: github.repository == 'petertecnetdev/cutinapp.petertecnet.com.br'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only audited refs at exact reviewed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            ["aux03/2026-10-10-producer-pain-point-post"]="337c9ba22a4b97f9bd8d48f09b695105a954f43f"
            ["aux-01/w3-recurring-event-producer-campaign"]="337c9ba22a4b97f9bd8d48f09b695105a954f43f"
            ["develop/cutinapp-shared"]="337c9ba22a4b97f9bd8d48f09b695105a954f43f"
            ["aux-01/growth-high-intent-event-guide"]="0cef076c207dfde909dc4824aee4ec46eab1d994"
            ["fix/cutinapp-official-logo-20261007"]="2447d7c82b2970aee4ca183132a5a3d780ecd978"
            ["aux-01/w2-event-ticket-price-label-guard-20261012"]="337c9ba22a4b97f9bd8d48f09b695105a954f43f"
            ["aux-01/w3-community-meetups-launch"]="ce61d7a3c47afc4639ed0012bc78fdc4cad26d4c"

            # Blog page + test preserved exactly in shared: commits 8b7a7ea and ba7c1d7.
            ["feat/blog-internal-links-seo"]="563575cd4b360de770ab2199d80e3d8435a26e7a"
            # Red palette content superseded by current main and shared.
            ["fix/cutinapp-official-red-palette-20261008"]="1923bb6fa5dc2f488f1f6c436cf4ba26a9565858"
            # Global brand CSS is identical to main except main adds new registration rules.
            ["fix/cutinapp-global-brand-css-20261008"]="b0bda21a5d0293367023585d950d87dfdc4db8b7"
            # Explicitly discarded: source says monetization by transaction fees
            # and removes campaign attribution; contrary to chosen SaaS/trial 30d.
            ["fix/producer-landing-monetization-truth"]="2a973b85bd0de3180d9ff243b4e3dd394e5f8ded"

            # PR711 closed as superseded: resolver + tests already in shared.
            ["aux-01/w1-wallet-image-path"]="84ffad4c5b23b6c8afc5d49e178cb155d7567726"
            # Old mobile code patches were incorporated into main; its remaining
            # landing CSS is purple legacy, superseded by red shared CTA.
            ["cycle/mobile-nav-reliability-20261007"]="8596ae017c3f4606a53a4eee3a1b093635b3ffb5"
            # All nine community feature paths are byte-identical to main.
            ["feat/community-meetups-20261007"]="25d87c4fd72f75fbc9bfc82a46d9257c10a61b72"
          )
          # The W1 event-ticket-price branch is deliberately protected:
          # active WORKING claim, despite identical HEAD. The PR710 growth
          # docs were independently SHA-compared and preserved in shared.
          failures=0
          deleted=0
          absent=0
          changed=0
          for branch in "${!expected[@]}"; do
            if [[ "$branch" == "main" || "$branch" == "cycle/mobile-nav-runtime-validation-20261007" ]]; then
              echo "Protected branch in deletion allowlist; aborting."
              exit 1
            fi
            if ! current=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null); then
              echo "Already absent: $branch"
              absent=$((absent + 1))
              continue
            fi
            if [[ "$current" != "${expected[$branch]}" ]]; then
              echo "Changed HEAD, SKIP $branch expected=${expected[$branch]} current=$current"
              changed=$((changed + 1))
              failures=$((failures + 1))
              continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted exact-head branch: $branch"
              deleted=$((deleted + 1))
            else
              echo "Deletion failed: $branch"
              failures=$((failures + 1))
            fi
          done
          echo "SUMMARY deleted=$deleted absent=$absent changed=$changed failures=$failures" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$failures" -eq 0 ]]
