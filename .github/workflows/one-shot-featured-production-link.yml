name: One-shot featured production link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-featured-production-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Link featured production card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/LandingPageV2.js')
          text = path.read_text()

          marker = '  const featuredProduction = productions[0] || null;\n'
          link_line = '  const featuredProductionLink = featuredProduction?.slug ? `/production/${encodeURIComponent(featuredProduction.slug)}/public` : "/productions";\n'
          if link_line not in text:
              if marker not in text:
                  raise SystemExit('featuredProduction marker not found')
              text = text.replace(marker, marker + link_line, 1)

          lines = text.splitlines()
          target = 'className="cut-landing__floatingCard cut-landing__floatingCard--people"'
          index = next((i for i, line in enumerate(lines) if target in line), None)
          if index is None:
              raise SystemExit('featured production card not found')

          if '<Link' not in lines[index]:
              indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
              if '<div' not in lines[index]:
                  raise SystemExit('unexpected featured production card markup')
              if index + 4 >= len(lines) or lines[index + 4].strip() != '</div>':
                  raise SystemExit('unexpected featured production card block')

              replacement = [
                  f'{indent}<Link',
                  f'{indent}  to={{featuredProductionLink}}',
                  f'{indent}  className="cut-landing__floatingCard cut-landing__floatingCard--people"',
                  f'{indent}  aria-label={{featuredProduction?.name ? `Abrir produção ${{featuredProduction.name}}` : "Explorar produções"}}',
                  f'{indent}  style={{{{ color: "inherit", textDecoration: "none", cursor: "pointer", pointerEvents: "auto", touchAction: "manipulation" }}}}',
                  f'{indent}>',
                  lines[index + 1],
                  lines[index + 2],
                  lines[index + 3],
                  f'{indent}</Link>',
              ]
              lines[index:index + 5] = replacement
              text = '\n'.join(lines) + '\n'

          path.write_text(text)
          PY

          if git diff --quiet -- src/pages/LandingPageV2.js; then
            echo 'No changes required.'
            exit 0
          fi

          git config user.name 'Peter Tecnet Automation'
          git config user.email 'petertecnet@gmail.com'
          git add src/pages/LandingPageV2.js
          git commit -m 'fix(landing): link featured production to public page'
          git push origin HEAD:main
