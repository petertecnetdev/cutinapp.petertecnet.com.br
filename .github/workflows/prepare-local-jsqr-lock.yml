name: Prepare local jsQR lockfile

on:
  push:
    branches:
      - automation/bundle-checkin-jsqr-20260909

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate deterministic lockfile
        run: npm install jsqr@1.4.0 --save --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: CI=true npm test -- --watchAll=false
      - name: Build
        run: npm run build
      - name: Performance budget
        run: npm run perf:budget
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/prepare-local-jsqr-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/prepare-local-jsqr-lock.yml
          git diff --cached --check
          git commit -m "chore(checkin): lock bundled QR decoder"
          git push origin HEAD:${GITHUB_REF_NAME}
