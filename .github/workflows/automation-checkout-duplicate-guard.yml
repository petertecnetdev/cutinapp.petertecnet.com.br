name: Apply checkout duplicate-payment guard

on:
  push:
    branches:
      - automation/checkout-duplicate-payment-guard-20260908

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[checkout-guard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded recovery policy
        shell: python
        run: |
          from pathlib import Path

          guidance = Path('src/utils/paymentFailureGuidance.js')
          text = guidance.read_text()
          old = '  return { ...classification, ...guidance[classification.reason] };\n'
          new = '''  return {
            ...classification,
            ...guidance[classification.reason],
            retryAllowed: classification.reason !== "duplicate_payment",
          };
          '''
          if old not in text:
              raise SystemExit('paymentFailureGuidance return anchor not found')
          guidance.write_text(text.replace(old, new, 1))

          tests = Path('src/utils/paymentFailureGuidance.test.js')
          text = tests.read_text()
          old = '''    expect(result.message).not.toContain("Recomendado: tente PIX");
          });

          test("does not recommend repeating identical data after a blacklist security block", () => {'''
          new = '''    expect(result.message).not.toContain("Recomendado: tente PIX");
            expect(result.retryAllowed).toBe(false);
          });

          test("keeps recovery actions enabled for ordinary recoverable failures", () => {
            const result = paymentFailureGuidance({
              method: "card",
              pixAvailable: true,
              payment: { provider_payload: { status_detail: "cc_rejected_bad_filled_security_code" } },
            });
            expect(result.reason).toBe("card_security_code");
            expect(result.retryAllowed).toBe(true);
          });

          test("does not recommend repeating identical data after a blacklist security block", () => {'''
          if old not in text:
              raise SystemExit('paymentFailureGuidance test anchor not found')
          tests.write_text(text.replace(old, new, 1))

          checkout = Path('src/pages/checkout/CheckoutPage.js')
          text = checkout.read_text()
          old = '''{failed && <Alert variant="danger" className="mb-0" role="alert" aria-live="assertive"><strong>{failedPaymentGuidance.title}</strong><div>{failedPaymentGuidance.message}</div><div className="d-grid gap-2 mt-3">{method === "card" && pixAvailable && <Button variant="light" onClick={() => recoverFailedPayment("pix")}><i className="fa-brands fa-pix me-2" />Pagar esta compra com PIX</Button>}<Button variant="outline-light" onClick={() => recoverFailedPayment(method)}>Tentar novamente com {method === "pix" ? "PIX" : "cartão"}</Button>{method === "pix" && cardAvailable && <Button variant="light" onClick={() => recoverFailedPayment("card")}><i className="fa-regular fa-credit-card me-2" />Tentar com cartão</Button>}</div></Alert>}'''
          new = '''{failed && <Alert variant="danger" className="mb-0" role="alert" aria-live="assertive"><strong>{failedPaymentGuidance.title}</strong><div>{failedPaymentGuidance.message}</div><div className="d-grid gap-2 mt-3">{failedPaymentGuidance.retryAllowed === false ? <Button variant="light" onClick={() => { trackCheckout("duplicate_payment_status_check", { label: "Status verificado após recusa por duplicidade", target: slug, metadata: { event_id: Number(catalog?.event?.id || 0), amount: Number(result?.order?.total || payableTotal || 0), payment_method: method, previous_status: orderStatus || "rejected" } }); syncCurrentPayment({ manual: true }); }} disabled={syncingNow}>{syncingNow ? "Verificando status..." : "Verificar status da compra"}</Button> : <>{method === "card" && pixAvailable && <Button variant="light" onClick={() => recoverFailedPayment("pix")}><i className="fa-brands fa-pix me-2" />Pagar esta compra com PIX</Button>}<Button variant="outline-light" onClick={() => recoverFailedPayment(method)}>Tentar novamente com {method === "pix" ? "PIX" : "cartão"}</Button>{method === "pix" && cardAvailable && <Button variant="light" onClick={() => recoverFailedPayment("card")}><i className="fa-regular fa-credit-card me-2" />Tentar com cartão</Button>}</>}</div></Alert>}'''
          if old not in text:
              raise SystemExit('CheckoutPage failed-payment action anchor not found')
          checkout.write_text(text.replace(old, new, 1))

          Path('.github/workflows/automation-checkout-duplicate-guard.yml').unlink()
      - name: Validate focused regression
        run: |
          npm ci --no-audit --no-fund
          npm test -- --watchAll=false --runInBand src/utils/paymentFailureGuidance.test.js
          npm run build
      - name: Commit applied change
        run: |
          git config user.name "Peter Tecnet Automation"
          git config user.email "automation@petertecnet.com.br"
          git add src/pages/checkout/CheckoutPage.js src/utils/paymentFailureGuidance.js src/utils/paymentFailureGuidance.test.js .github/workflows/automation-checkout-duplicate-guard.yml
          git commit -m "fix(checkout): block retries after duplicate payment [checkout-guard-applied]"
          git push origin HEAD:automation/checkout-duplicate-payment-guard-20260908
