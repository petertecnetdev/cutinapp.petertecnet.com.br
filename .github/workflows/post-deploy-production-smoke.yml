name: Post-deploy Production Smoke

on:
  workflow_run:
    workflows: ["Deploy VPS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run production onboarding smoke
        env:
          API_BASE: https://api.petertecnet.com.br
          CUTINAPP_ORIGIN: https://cutinapp.petertecnet.com.br
          SMOKE_TOKEN: ${{ secrets.CUTINAPP_SMOKE_TOKEN }}
        run: node scripts/production-smoke.mjs
